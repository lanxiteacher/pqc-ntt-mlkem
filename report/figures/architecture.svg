<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
<rect width="1000" height="690" fill="#ffffff"/>

<text x="500" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2933">架构：宽接口留在核内，对外固定 12 位</text>
<text x="500" y="58" text-anchor="middle" font-size="12.5" fill="#6b7785">折叠度 PE_NUMBER = 1 / 4 / 16 三档，对外接口逐位相同 —— 引脚数与折叠度解耦</text>

<!-- ============ 顶层 KyberHPMNTT_top ============ -->
<rect x="170" y="96" width="790" height="470" rx="10" fill="#f7f9fb" stroke="#c3cbd4" stroke-width="1.4"/>
<text x="190" y="120" font-size="14" font-weight="700" fill="#1f2933">KyberHPMNTT_top  #(.PE_NUMBER(n))</text>
<text x="190" y="138" font-size="11.5" fill="#6b7785">对外接口三档完全相同（上层协议状态机看到的是同一张脸）</text>

<!-- ============ 左侧端口 ============ -->
<rect x="24" y="238" width="126" height="40" rx="6" fill="#eef4fa" stroke="#4a90c4" stroke-width="1.4"/>
<text x="87" y="263" text-anchor="middle" font-size="13" fill="#1f2933">din[11:0]</text>

<rect x="24" y="294" width="126" height="40" rx="6" fill="#eef8f0" stroke="#4a9c68" stroke-width="1.4"/>
<text x="87" y="319" text-anchor="middle" font-size="13" fill="#1f2933">dout[11:0]</text>

<rect x="24" y="375" width="126" height="88" rx="6" fill="#fdf8ee" stroke="#d8b26a" stroke-width="1.4"/>
<text x="87" y="399" text-anchor="middle" font-size="12" fill="#1f2933">clk ｜ rst</text>
<text x="87" y="419" text-anchor="middle" font-size="12" fill="#1f2933">start_fntt</text>
<text x="87" y="436" text-anchor="middle" font-size="12" fill="#1f2933">start_pwm2</text>
<text x="87" y="453" text-anchor="middle" font-size="12" fill="#1f2933">start_intt ｜ done</text>

<!-- ============ 核外：序列化 ============ -->
<rect x="200" y="234" width="130" height="48" rx="6" fill="#ffffff" stroke="#7aa8cc" stroke-width="1.4"/>
<text x="265" y="263" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2933">反序列化器</text>

<rect x="200" y="290" width="130" height="48" rx="6" fill="#ffffff" stroke="#7aa8cc" stroke-width="1.4"/>
<text x="265" y="319" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2933">序列化器</text>

<text x="265" y="356" text-anchor="middle" font-size="10.5" fill="#6b7785">核外：只做位宽转换</text>

<!-- ============ 核 KyberHPMNTT ============ -->
<rect x="360" y="170" width="580" height="330" rx="8" fill="#eef4fa" stroke="#4a90c4" stroke-width="1.6"/>
<text x="376" y="194" font-size="13.5" font-weight="700" fill="#1f2933">核  KyberHPMNTT</text>
<text x="376" y="212" font-size="11" fill="#6b7785">宽接口 din[12·PE−1:0] ／ dout[12·PE−1:0] —— 只在核内，不对外</text>

<!-- 核内：双 bank 存储 -->
<rect x="380" y="234" width="150" height="48" rx="5" fill="#ffffff" stroke="#7aa8cc" stroke-width="1.4"/>
<text x="455" y="263" text-anchor="middle" font-size="12.5" fill="#1f2933">BRAM A（bank 0）</text>

<rect x="380" y="290" width="150" height="48" rx="5" fill="#ffffff" stroke="#7aa8cc" stroke-width="1.4"/>
<text x="455" y="319" text-anchor="middle" font-size="12.5" fill="#1f2933">BRAM B（bank 1）</text>

<text x="490" y="356" text-anchor="middle" font-size="10.5" fill="#6b7785">双 bank 乒乓（位宽恒 12）</text>

<!-- 核内：蝶形阵列 -->
<rect x="590" y="222" width="150" height="116" rx="5" fill="#ffffff" stroke="#4a90c4" stroke-width="1.6"/>
<text x="665" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">蝶形阵列</text>
<text x="665" y="284" text-anchor="middle" font-size="11.5" fill="#1f2933">PE_NUMBER 个</text>
<text x="665" y="304" text-anchor="middle" font-size="11" fill="#6b7785">一拍算 PE_NUMBER 对</text>
<text x="665" y="324" text-anchor="middle" font-size="11" fill="#6b7785">1 ｜ 4 ｜ 16</text>

<!-- 核内：BROM -->
<rect x="775" y="222" width="145" height="116" rx="5" fill="#ffffff" stroke="#7aa8cc" stroke-width="1.4"/>
<text x="847" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">BROM</text>
<text x="847" y="284" text-anchor="middle" font-size="11" fill="#6b7785">twiddle 常数表</text>
<text x="847" y="304" text-anchor="middle" font-size="11" fill="#6b7785">位宽 12 × PE</text>
<text x="847" y="324" text-anchor="middle" font-size="11" fill="#6b7785">三档表内容不同</text>

<!-- 核内：控制 -->
<rect x="380" y="386" width="540" height="66" rx="5" fill="#fdf8ee" stroke="#d8b26a" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="650" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">控制 FSM ＋ addressgenerator</text>
<text x="650" y="434" text-anchor="middle" font-size="11" fill="#6b7785">每拍给出：读哪两个 · 写回哪两个 · 用哪个 twiddle　（IDLE → 装载 → 运算 → 读出）</text>

<!-- ============ 连线 ============ -->
<!-- din → 反序列化器 -->
<line x1="150" y1="258" x2="194" y2="258" stroke="#4a90c4" stroke-width="1.6"/>
<polygon points="200,258 190,253 190,263" fill="#4a90c4"/>

<!-- 反序列化器 → BRAM A -->
<line x1="330" y1="258" x2="374" y2="258" stroke="#4a90c4" stroke-width="1.6"/>
<polygon points="380,258 370,253 370,263" fill="#4a90c4"/>

<!-- BRAM B → 序列化器 -->
<line x1="380" y1="314" x2="336" y2="314" stroke="#4a9c68" stroke-width="1.6"/>
<polygon points="330,314 340,309 340,319" fill="#4a9c68"/>

<!-- 序列化器 → dout -->
<line x1="200" y1="314" x2="156" y2="314" stroke="#4a9c68" stroke-width="1.6"/>
<polygon points="150,314 160,309 160,319" fill="#4a9c68"/>

<!-- BRAM 组 ↔ 蝶形阵列（读 / 写） -->
<path d="M530,258 H548 M530,314 H548 M548,258 V314" stroke="#4a90c4" stroke-width="1.4" fill="none"/>
<line x1="548" y1="286" x2="584" y2="286" stroke="#4a90c4" stroke-width="1.6"/>
<polygon points="590,286 580,281 580,291" fill="#4a90c4"/>
<polygon points="548,286 558,281 558,291" fill="#4a90c4"/>
<text x="569" y="252" text-anchor="middle" font-size="10.5" fill="#6b7785">读／写</text>

<!-- BROM → 蝶形阵列 -->
<line x1="775" y1="280" x2="746" y2="280" stroke="#4a90c4" stroke-width="1.6"/>
<polygon points="740,280 750,275 750,285" fill="#4a90c4"/>

<!-- 控制 → 三个部件（虚线，表示是控制而不是数据） -->
<line x1="400" y1="386" x2="400" y2="344" stroke="#d8b26a" stroke-width="1.4" stroke-dasharray="4 3"/>
<polygon points="400,338 395,348 405,348" fill="#d8b26a"/>

<line x1="665" y1="386" x2="665" y2="344" stroke="#d8b26a" stroke-width="1.4" stroke-dasharray="4 3"/>
<polygon points="665,338 660,348 670,348" fill="#d8b26a"/>

<line x1="847" y1="386" x2="847" y2="344" stroke="#d8b26a" stroke-width="1.4" stroke-dasharray="4 3"/>
<polygon points="847,338 842,348 852,348" fill="#d8b26a"/>

<!-- 控制端口 → 控制块 -->
<line x1="150" y1="419" x2="374" y2="419" stroke="#d8b26a" stroke-width="1.4" stroke-dasharray="4 3"/>
<polygon points="380,419 370,414 370,424" fill="#d8b26a"/>

<!-- ============ 底部注 ============ -->
<line x1="24" y1="592" x2="976" y2="592" stroke="#c3cbd4" stroke-width="1"/>
<text x="24" y="616" font-size="12" fill="#1f2933">对外固定 12 位 ⇒ 三档 Bonded IOB 恒为 37（12 控制 ＋ 1 时钟 ＋ din[11:0] ＋ dout[11:0]）。上游「接口宽度 = 12 × 蝶形数」到 16 蝶形要 397 个引脚，而芯片只有 125 个。</text>
<text x="24" y="638" font-size="11.5" fill="#6b7785">把序列化放到核外，是唯一「改接口宽度而不动核的 FSM」的做法：PE_NUMBER = 1 时序列化器直通，pe1 已验证的时序与 KAT 结论原样保留。</text>
<text x="24" y="662" font-size="11.5" fill="#6b7785">数字出处：rtl/vivado/folding_comparison.md §五／§六（397 / 125）与 §九（三档 IOB = 37）；端口与时序见 rtl/H1_port_spec.md §一／§六。</text>
</svg>
